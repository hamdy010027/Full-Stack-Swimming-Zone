<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/forget-password.css" />
  </head>
  <body>
    <div class="container">
      <!-- Left Panel -->
      <div class="left-panel">
        <h1>Forgot Password?</h1>

        <p>Remember your password?</p>

        <a href="file:///D:/projects/Full_Stack_project/FullStackSwimmingZone/backend/index.html" class="btn-outline"> Login </a>
      </div>

      <!-- Right Panel -->
      <div class="right-panel">
        <h2>Forgot Password</h2>

        <form id="forgotForm">
          <div class="input-box">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />

            <i class="fa-solid fa-envelope"></i>
          </div>

          <button type="submit" class="btn-submit">Send Code</button>
        </form>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="../js/forget-password.js"></script>
  </body>
</html>

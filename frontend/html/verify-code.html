<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Verify Code</title>

<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<!-- Google Font -->
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<!-- CSS -->
<link rel="stylesheet" href="../css/verify-code.css" />

  </head>  <body><div class="container">

  <!-- Left Panel -->
  <div class="left-panel">

    <h1>Check Your Email!</h1>

    <p>
      We sent a verification code to your email.
    </p>

    <a
      href="./forget-password.html"
      class="btn-outline"
    >
      Back
    </a>

  </div>

  <!-- Right Panel -->
  <div class="right-panel">

    <h2>Verify Code</h2>

    <form id="verifyForm">

      <div class="input-box">

        <label for="code">
          Verification Code
        </label>

        <input
          type="text"
          id="code"
          name="code"
          placeholder="Enter the code"
          maxlength="6"
          required
        />

        <i class="fa-solid fa-key"></i>

      </div>

      <button
        type="submit"
        class="btn-submit"
      >
        Verify Code
      </button>

    </form>

  </div>

</div>

<!-- JavaScript -->
<script src="../js/verify-code.js"></script>

  </body>
</html>

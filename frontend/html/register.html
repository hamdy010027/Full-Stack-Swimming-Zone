<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <h1>Welcome Back!</h1>
        <p>Already have an account?</p>
        <a href="/index.html" class="btn-outline-link">Login</a>
      </div>

      <div class="right-panel">
        <h2>Register</h2>
        <form id="contactForm" method="post">
          <div class="input-box">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
            <i class="fa-solid fa-user"></i>
          </div>

          <div class="input-box">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
            <i class="fa-solid fa-envelope"></i>
          </div>

          <div class="input-box">
            <label for="pass">Password</label>
            <input
              type="password"
              id="pass"
              name="pass"
              placeholder="Enter your password"
              required
            />
            <i class="fa-solid fa-lock"></i>
          </div>

          <button type="submit" class="btn-submit">Register</button>
        </form>

        <p class="social-text">or register with social platforms</p>

        <div class="social-icons">
          <a href="https://www.instagram.com/swimming_zone_egypt?stkn=YWk3M3Uwa2Framwz"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://www.facebook.com/share/1Qc4uaDecM/"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://www.tiktok.com/@swimming.zone.egy?_r=1&_t=ZS-99oFSf0Ez0m"><i class="fa-brands fa-tiktok"></i></a>
          <a href="https://wa.me/+201069098373"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
      </div>
    </div>
    <script src="../js/register.js"></script>
  </body>
</html>
